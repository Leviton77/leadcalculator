# Запускает агента Claude Code, когда в задаче или PR появляется комментарий с @claude.
# Так работает команда пульта «запусти агента на задаче N» (start_task).
# Нужен секрет репозитория CLAUDE_CODE_OAUTH_TOKEN (получить: `claude setup-token`).
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Только комментарии с @claude от людей с правом записи (так проверяет сам action).
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # Агент сам PR не открывает: он пушит ветку claude/issue-N-... и оставляет ссылку «Create PR».
      # Этот шаг открывает PR за него, чтобы результат задачи сразу был виден.
      # Нужна настройка репозитория: Settings → Actions → General →
      # «Allow GitHub Actions to create and approve pull requests».
      - name: Open a pull request for the agent's branch
        if: success() && github.event_name == 'issue_comment' && !github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BRANCH_FROM_ACTION: ${{ steps.claude.outputs.branch_name }}
        run: |
          branch="$BRANCH_FROM_ACTION"
          if [ -z "$branch" ]; then
            # Самая свежая ветка агента по этой задаче (в имени есть дата и время, сортировка по имени).
            branch=$(git ls-remote --heads origin "claude/issue-${ISSUE}-*" | sed 's#.*refs/heads/##' | sort | tail -n 1)
          fi
          if [ -z "$branch" ] || ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Агент не оставил ветку (например, только ответил в задаче). PR не нужен."
            exit 0
          fi
          if [ -n "$(gh pr list --repo "$REPO" --head "$branch" --state all --json number --jq '.[].number')" ]; then
            echo "PR для ветки $branch уже есть."
            exit 0
          fi
          gh pr create --repo "$REPO" --head "$branch" --base "$BASE" \
            --title "$ISSUE_TITLE" \
            --body "Результат работы агента Claude Code по задаче #${ISSUE}. Ветка: \`${branch}\`.

          Closes #${ISSUE}" \
            || echo "Не удалось открыть PR для $branch (возможно, в ветке нет новых коммитов)."
